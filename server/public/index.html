<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAB 客户总览</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>WAB 客户总览</h1>
    <span class="sub">WhatsApp 多账号去重</span>
  </div>
  <div class="stats" id="stats">
    <div class="stat"><div class="stat-v" id="st-accounts">–</div><div class="stat-l">账号</div></div>
    <div class="stat"><div class="stat-v" id="st-customers">–</div><div class="stat-l">客户</div></div>
    <div class="stat stat-dup"><div class="stat-v" id="st-duplicates">–</div><div class="stat-l">重复客户</div></div>
    <div class="stat"><div class="stat-v" id="st-fansToday">–</div><div class="stat-l">今日进粉<span id="st-fansTodayDup"></span></div></div>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <h2>每日进粉</h2>
      <span class="spacer"></span>
      <select id="d-days">
        <option value="7">近 7 天</option>
        <option value="14">近 14 天</option>
        <option value="30">近 30 天</option>
      </select>
      <a id="btn-daily-export" class="btn" href="/api/daily.csv?days=7">导出 CSV</a>
    </div>
    <p class="muted small">每个账号每天新进的客户数；<span class="dup-tag">重 N</span> 表示其中 N 个之前已在别的账号出现过。账号刚接入时导入的历史聊天不计入。</p>
    <div class="matrix-wrap">
      <table id="daily-tbl" class="matrix">
        <thead id="daily-head"></thead>
        <tbody id="daily-rows"></tbody>
      </table>
    </div>
  </section>

  <section class="toolbar">
    <label class="chk"><input type="checkbox" id="f-dup" checked> 只看重复</label>
    <select id="f-account"><option value="">全部账号</option></select>
    <select id="f-status">
      <option value="">全部状态</option>
      <option value="new">新客户</option>
      <option value="following">跟进中</option>
      <option value="won">已成交</option>
      <option value="lost">已流失</option>
    </select>
    <input id="f-q" type="search" placeholder="搜索号码 / 名称">
    <span class="spacer"></span>
    <span class="muted" id="count"></span>
    <button id="btn-refresh">刷新</button>
    <a id="btn-export" class="btn" href="/api/export.csv?dup=1">导出 CSV</a>
  </section>

  <section class="card">
    <table id="tbl">
      <thead>
        <tr>
          <th>客户</th>
          <th>出现在的账号</th>
          <th class="num">账号数</th>
          <th>首次联系</th>
          <th>最后消息</th>
          <th>状态</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>没有符合条件的客户</div>
  </section>

  <section class="card">
    <h2>账号</h2>
    <p class="muted small">给账号起个别名（比如"美区-3"、"AdsPower #12"），页面上的提醒会显示别名而不是号码。</p>
    <table id="acc-tbl">
      <thead>
        <tr><th>号码</th><th>别名</th><th class="num">客户数</th><th class="num">重复数</th><th>上次同步</th></tr>
      </thead>
      <tbody id="acc-rows"></tbody>
    </table>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
